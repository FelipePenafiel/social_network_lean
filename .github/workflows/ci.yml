name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Check STATUS.md, and that every obstruction is documented
        # No toolchain needed, so it runs before the build and fails fast.  It also
        # checks that every Lean name the blueprint cites exists, that no `sorry` in the
        # sources is missing from the blueprint, and that anything unproved has a
        # recorded reason.
        run: python3 scripts/status.py --check

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib build cache
        # A cache miss is not fatal: the project imports only a small slice of Mathlib, so
        # a from-source build still fits in the job timeout.
        run: lake exe cache get || echo "cache unavailable, building from source"

      - name: Build
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log

      - name: No warnings but the deliberate ones
        # The only warnings this build may emit are the `sorry`s, which are deliberate and
        # inventoried in the next step.  Everything else — a deprecation, an unused
        # hypothesis, a section variable that no longer belongs — is noise that hides the
        # next real warning, so it fails the build instead of accumulating.  Both the
        # toolchain and Mathlib are pinned, so this cannot go red on its own.
        run: |
          if grep -E '^warning:' build.log | grep -v "declaration uses \`sorry\`" > noise.log
          then
            echo "::error::the build emits warnings other than the deliberate sorries"
            cat noise.log
            exit 1
          fi
          echo "no warnings but the $(grep -c 'declaration uses .sorry.' build.log) sorries"

      - name: Inventory of unproved statements
        # `sorry` is allowed: the library states every numbered result of the paper, and the
        # ones whose proofs are not formalised carry a `sorry`.  What is NOT allowed is a
        # `sorry` leaking into a result declared complete; that is what the next step checks.
        run: |
          echo "### Unproved statements" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Anchored on a bare `sorry` line: the word also occurs in prose, in the
          # docstrings that explain why a statement is unproved.
          grep -rn --include='*.lean' -E '^[[:space:]]*sorry[[:space:]]*$' SocialNetwork/ \
            | sed 's/:.*sorry.*/: sorry/' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          n=$(grep -rc --include='*.lean' -E '^[[:space:]]*sorry[[:space:]]*$' SocialNetwork/ \
            | awk -F: '{s+=$2} END {print s+0}')
          echo "total: $n" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check axioms of the completed results
        # Every declaration checked here is claimed to be fully proved.  If one of them
        # starts depending on `sorryAx`, or on any axiom beyond Lean's own three, the claim
        # is false and the build must fail.
        #
        # The list is GENERATED from the blueprint: it is exactly the declarations cited
        # by a node the dependency graph resolves to proved or stated.  So a `\leanok`
        # that has not been earned fails CI, and a renamed declaration cannot silently
        # drop out of the check — which is what happened twice while the list was typed
        # by hand.  Declarations no node cites are listed in `scripts/status.py`.
        run: |
          python3 scripts/status.py --axioms CheckAxioms.lean
          checked=$(grep -c '^#print axioms' CheckAxioms.lean)
          echo "checking $checked declarations"
          # `set -o pipefail` matters: without it the pipe into `tee` masks a non-zero
          # exit from `lean`, and a name that no longer resolves is then not checked.
          set -o pipefail
          lake env lean CheckAxioms.lean | tee axioms.txt
          if grep -q 'sorryAx' axioms.txt; then
            echo "::error::a result declared complete depends on sorryAx"
            exit 1
          fi
          # The library declares no axiom: the two citations of [LM22] are hypotheses of
          # the theorems that use them (CONVENTIONS.md §5).  So Lean's own three are the
          # only axioms a complete result may reach.  A long list wraps over several
          # lines, so the output is read flattened, and every declaration has to be
          # accounted for, or a change of format would pass the check unread.
          flat=$(tr '\n' ' ' < axioms.txt | tr -s ' ')
          reported=$(echo "$flat" | grep -o 'depends on axioms\|does not depend on any axioms' | wc -l)
          if [ "$reported" -ne "$checked" ]; then
            echo "::error::$checked declarations checked, and $reported reported by #print axioms"
            exit 1
          fi
          if echo "$flat" | grep -o 'depends on axioms: \[[^]]*\]' | sed 's/.*\[//; s/\]//' \
              | tr ',' '\n' | tr -d ' ' | sort -u | grep -vxE 'propext|Classical\.choice|Quot\.sound'
          then
            echo "::error::a result declared complete depends on an axiom beyond Lean's own"
            exit 1
          fi
          echo "every completed result is sorry-free, and depends on no axiom beyond Lean's own"
