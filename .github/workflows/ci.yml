name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib build cache
        # A cache miss is not fatal: the project imports only a small slice of Mathlib, so
        # a from-source build still fits in the job timeout.
        run: lake exe cache get || echo "cache unavailable, building from source"

      - name: Build
        run: lake build

      - name: Inventory of unproved statements
        # `sorry` is allowed: the library states every numbered result of the paper, and the
        # ones whose proofs are not formalised carry a `sorry`.  What is NOT allowed is a
        # `sorry` leaking into a result declared complete; that is what the next step checks.
        run: |
          echo "### Unproved statements" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -rn --include='*.lean' -E '\bsorry\b' SocialNetwork/ \
            | sed 's/:.*sorry.*/: sorry/' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          n=$(grep -rc --include='*.lean' -E '\bsorry\b' SocialNetwork/ | awk -F: '{s+=$2} END {print s+0}')
          echo "total: $n" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check axioms of the completed results
        # Every declaration listed here is claimed to be fully proved.  If one of them starts
        # depending on `sorryAx`, the claim is false and the build must fail.  Declarations
        # that are deliberately unproved are absent from this list and are inventoried above.
        run: |
          cat > CheckAxioms.lean <<'EOF'
          import SocialNetwork
          -- Section 2: the model
          #print axioms SocialNetwork.IsState.express
          #print axioms SocialNetwork.trust_express
          #print axioms SocialNetwork.IsLadder.isSteepLadder
          #print axioms SocialNetwork.IsLadder.isConsensus
          -- Section 5: the deterministic layer
          #print axioms SocialNetwork.Trajectory.isState_state
          #print axioms SocialNetwork.exists_rowSup_actor_lt
          #print axioms SocialNetwork.entry_mem_of_greedy
          #print axioms SocialNetwork.isLadder_state
          #print axioms SocialNetwork.firstRepeat_le
          #print axioms SocialNetwork.isConsensus_of_nonpos
          #print axioms SocialNetwork.rowSup_state_le
          -- Section 3: the biased model
          #print axioms SocialNetwork.Bias.Memory.pressure_hear
          #print axioms SocialNetwork.Bias.Memory.sum_pressure_eq
          #print axioms SocialNetwork.Bias.sum_range_card_le_sum
          #print axioms SocialNetwork.Bias.sum_ge_of_injective
          #print axioms SocialNetwork.Bias.IsBiasedState.two_mul_totalHeard_ge
          #print axioms SocialNetwork.Bias.measurableSet_nearGreedyEvents
          #print axioms SocialNetwork.Bias.measurableSet_biasedGreedyEvents
          -- Definition 3: the skeleton
          #print axioms SocialNetwork.isMarkovKernel_skeletonKernel
          #print axioms SocialNetwork.skeletonKernel_reachable
          #print axioms SocialNetwork.isState_skeletonKernel
          #print axioms SocialNetwork.measurableSet_greedyEvent
          #print axioms SocialNetwork.entry_mem_of_mem_greedyEvents
          #print axioms SocialNetwork.isLadder_state_of_mem_greedyEvents
          -- Proposition 8 and Remarks 4, 5
          #print axioms SocialNetwork.le_entrySup_sub_one
          #print axioms SocialNetwork.one_sub_le_zeta_pow
          #print axioms SocialNetwork.IsSteepLadder.express_of_pos
          #print axioms SocialNetwork.zeta_le_jumpPMF_argmaxFinset
          #print axioms SocialNetwork.zeta_pow_le_pathMeasure_greedyEvents
          #print axioms SocialNetwork.one_sub_le_pathMeasure_greedyEvents
          -- The continuous-time process
          #print axioms SocialNetwork.jumpCount_eq_iff
          #print axioms SocialNetwork.measurable_jumpCount
          #print axioms SocialNetwork.measurable_state_ofStepPath
          #print axioms SocialNetwork.measurable_process
          EOF
          lake env lean CheckAxioms.lean | tee axioms.txt
          if grep -q 'sorryAx' axioms.txt; then
            echo "::error::a result declared complete depends on sorryAx"
            exit 1
          fi
          echo "every completed result is sorry-free"
